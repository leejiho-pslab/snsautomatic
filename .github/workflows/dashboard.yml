name: dashboard

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - 'clients/**'
      - 'data/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Build design tokens
        run: node scripts/build-tokens.js

      - name: Render carousel cards
        run: |
          npx playwright install chromium --with-deps
          node -e "
          import('./scripts/lib/render.js').then(async ({renderPost}) => {
            const fs = await import('node:fs');
            for (const client of fs.readdirSync('clients').filter(d => !d.startsWith('_') && fs.existsSync('clients/'+d+'/config.json'))) {
              const cdir = 'clients/'+client+'/content';
              if (!fs.existsSync(cdir)) continue;
              for (const post of fs.readdirSync(cdir)) {
                try { await renderPost(client, post); } catch (e) { console.error(client, post, e.message); }
              }
            }
          });"

      - name: Build dashboard (with secrets-aware checklist)
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_USER_ID__DONGSUNG_PRINT: ${{ secrets.IG_USER_ID__DONGSUNG_PRINT }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
        run: node scripts/build-dashboard.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

      - id: deployment
        uses: actions/deploy-pages@v4
