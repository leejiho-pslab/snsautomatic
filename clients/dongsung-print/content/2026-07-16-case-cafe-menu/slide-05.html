<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="../../design-tokens.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1350px; overflow: hidden;
    font-family: 'Pretendard', -apple-system, 'Noto Sans KR', sans-serif;
    background: var(--brand-primary); color: #fff;
    display: flex; flex-direction: column;
  }
  .head { padding: 72px 80px 0; }
  .logo { font-size: 30px; font-weight: 800; }
  .logo .dot { color: var(--brand-yellow); }
  .main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 80px; }
  .save { font-size: 34px; font-weight: 600; color: var(--brand-cyan); margin-bottom: 28px; }
  h1 { font-size: 76px; font-weight: 800; line-height: 1.25; letter-spacing: -0.03em; word-break: keep-all; margin-bottom: 56px; }
  h1 em { font-style: normal; color: var(--brand-yellow); }
  .contact { background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.15); border-radius: 28px; padding: 44px 48px; }
  .contact .row { display: flex; align-items: baseline; gap: 24px; font-size: 32px; line-height: 1.5; }
  .contact .row + .row { margin-top: 22px; }
  .contact .label { flex: none; width: 190px; font-weight: 700; color: var(--brand-yellow); }
  .contact .val { font-weight: 500; color: rgba(255,255,255,.92); }
  .foot { padding: 0 80px 96px; display: flex; justify-content: space-between; align-items: flex-end; }
  .handle { font-size: 26px; font-weight: 600; color: rgba(255,255,255,.6); }
  .cmyk { display: flex; }
  .cmyk span { width: 56px; height: 20px; display: block; }
  .cmyk .c { background: var(--brand-cyan); } .cmyk .m { background: var(--brand-magenta); }
  .cmyk .y { background: var(--brand-yellow); } .cmyk .k { background: #000; }
</style>
</head>
<body>
  <div class="head">
    <div class="logo">동성인쇄소<span class="dot">.</span></div>
  </div>
  <div class="main">
    <div class="save">우리 가게 인쇄물도 고민된다면 📌</div>
    <h1>지금 쓰는 인쇄물<br>사진 한 장이면<br><em>개선안과 견적</em>을<br>드립니다</h1>
    <div class="contact">
      <div class="row"><span class="label">견적 문의</span><span class="val">프로필 링크 · 카카오채널 @동성인쇄소</span></div>
      <div class="row"><span class="label">전화</span><span class="val">0507-0000-0000 (평일 09–18시)</span></div>
      <div class="row"><span class="label">취급 품목</span><span class="val">명함 · 스티커 · 리플렛 · 봉투 · 소량 인쇄</span></div>
    </div>
  </div>
  <div class="foot">
    <div class="handle">@dongsung_print</div>
    <div class="cmyk"><span class="c"></span><span class="m"></span><span class="y"></span><span class="k"></span></div>
  </div>
</body>
</html>
