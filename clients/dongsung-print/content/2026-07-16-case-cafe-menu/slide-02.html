<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="../../design-tokens.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1350px; overflow: hidden;
    font-family: 'Pretendard', -apple-system, 'Noto Sans KR', sans-serif;
    background: var(--brand-bg); color: var(--brand-text);
    display: flex; flex-direction: column;
  }
  .head { display: flex; justify-content: space-between; align-items: center; padding: 72px 80px 0; }
  .logo { font-size: 26px; font-weight: 800; color: var(--brand-primary); }
  .logo .dot { color: var(--brand-magenta); }
  .page { font-size: 24px; font-weight: 600; color: #9A968C; }
  .main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 80px; }
  .num { width: 88px; height: 88px; border-radius: 24px; background: var(--brand-primary); color: var(--brand-yellow); font-size: 44px; font-weight: 800; display: flex; align-items: center; justify-content: center; margin-bottom: 40px; }
  h2 { font-size: 60px; font-weight: 800; line-height: 1.28; letter-spacing: -0.02em; color: var(--brand-primary); word-break: keep-all; margin-bottom: 36px; }
  .body { font-size: 33px; line-height: 1.62; font-weight: 400; color: #3A3A40; word-break: keep-all; }
  .body strong { font-weight: 700; color: var(--brand-text); box-shadow: inset 0 -0.45em 0 rgba(245,197,24,.45); }
  .tip { margin-top: 44px; background: #fff; border-left: 10px solid var(--brand-cyan); border-radius: 0 20px 20px 0; padding: 30px 36px; font-size: 29px; line-height: 1.55; color: #3A3A40; word-break: keep-all; }
  .tip b { color: var(--brand-primary); }
  .foot { padding: 0 80px 96px; display: flex; justify-content: space-between; align-items: flex-end; }
  .handle { font-size: 24px; font-weight: 600; color: #9A968C; }
  .cmyk { display: flex; }
  .cmyk span { width: 56px; height: 20px; display: block; }
  .cmyk .c { background: var(--brand-cyan); } .cmyk .m { background: var(--brand-magenta); }
  .cmyk .y { background: var(--brand-yellow); } .cmyk .k { background: #000; }
</style>
</head>
<body>
  <div class="head">
    <div class="logo">동성인쇄소<span class="dot">.</span></div>
    <div class="page">02 / 05</div>
  </div>
  <div class="main">
    <div class="num">B</div>
    <h2>Before:<br>3개월마다 다시 뽑던 메뉴판</h2>
    <div class="body">일반 사무용지 출력 + 코팅 없음. <strong>물 얼룩, 모서리 해짐, 글자 번짐</strong>으로 석 달마다 재출력하셨어요. 잉크값과 시간이 계속 새고 있었습니다.</div>
    <div class="tip"><b>진단</b> · 메뉴판은 손님 손과 물기에 하루 종일 노출되는 인쇄물 — 내구성이 곧 디자인입니다.</div>
  </div>
  <div class="foot">
    <div class="handle">@dongsung_print</div>
    <div class="cmyk"><span class="c"></span><span class="m"></span><span class="y"></span><span class="k"></span></div>
  </div>
</body>
</html>
