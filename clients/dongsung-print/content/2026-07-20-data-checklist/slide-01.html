<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --brand-primary: #12284B;
    --brand-bg: #F7F5F0;
    --brand-text: #1A1A1E;
    --brand-cyan: #00A6D6;
    --brand-magenta: #E5197C;
    --brand-yellow: #F5C518;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1350px; overflow: hidden;
    font-family: 'Pretendard', -apple-system, 'Noto Sans KR', sans-serif;
    background: var(--brand-primary); color: #fff;
    display: flex; flex-direction: column;
  }
  .head { display: flex; justify-content: space-between; align-items: center; padding: 72px 80px 0; }
  .logo { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; }
  .logo .dot { color: var(--brand-yellow); }
  .pillar { font-size: 24px; font-weight: 600; color: rgba(255,255,255,.65); border: 2px solid rgba(255,255,255,.3); border-radius: 999px; padding: 10px 26px; }
  .main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 80px; }
  .kicker { font-size: 34px; font-weight: 600; color: var(--brand-cyan); margin-bottom: 28px; }
  h1 { font-size: 88px; font-weight: 800; line-height: 1.22; letter-spacing: -0.03em; word-break: keep-all; }
  h1 em { font-style: normal; color: var(--brand-yellow); }
  .sub { margin-top: 36px; font-size: 34px; font-weight: 400; color: rgba(255,255,255,.75); line-height: 1.5; word-break: keep-all; }
  .foot { padding: 0 80px 96px; display: flex; justify-content: space-between; align-items: flex-end; }
  .swipe { font-size: 26px; font-weight: 600; color: rgba(255,255,255,.6); }
  .cmyk { display: flex; }
  .cmyk span { width: 56px; height: 20px; display: block; }
  .cmyk .c { background: var(--brand-cyan); } .cmyk .m { background: var(--brand-magenta); }
  .cmyk .y { background: var(--brand-yellow); } .cmyk .k { background: #000; }
</style>
</head>
<body>
  <div class="head">
    <div class="logo">동성인쇄소<span class="dot">.</span></div>
    <div class="pillar">인쇄 지식</div>
  </div>
  <div class="main">
    <div class="kicker">인쇄사고 예방 체크리스트</div>
    <h1>파일 그대로 보내면<br>사고 납니다.<br><em>넘기기 전 체크 5</em></h1>
    <div class="sub">잘린 글자, 탁해진 색, 깨진 폰트… 인쇄 사고의 90%는 데이터에서 시작돼요.</div>
  </div>
  <div class="foot">
    <div class="swipe">옆으로 넘겨보세요 →</div>
    <div class="cmyk"><span class="c"></span><span class="m"></span><span class="y"></span><span class="k"></span></div>
  </div>
</body>
</html>
